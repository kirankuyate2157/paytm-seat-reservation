
databases:
  - name: seats-db
    databaseName: seats
    user: seats
    plan: free

services:
  - type: web
    name: seat-reservation
    runtime: docker
    plan: free
    healthCheckPath: /health/ready
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: seats-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@example.com
      - key: ADMIN_PASSWORD
        sync: false          
      - key: COOKIE_SECURE
        value: "true"
      - key: SEED_DEMO
        value: "true"
      - key: DB_POOL_SIZE
        value: "10"
      - key: DB_MAX_OVERFLOW
        value: "5"
      - key: DB_CONCURRENCY
        value: "20"
      - key: APP_ENV
        value: production    # makes the app refuse to start with default secrets